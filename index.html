<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Suratku — Pembuat Surat Resmi</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Serif:ital@0;1&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

  <header class="topbar">
    <div class="brand">
      <span class="brand-mark">✒</span>
      <span class="brand-name">Suratku</span>
    </div>
    <nav class="tabs" id="tabs"></nav>
  </header>

  <main class="workspace">
    <section class="form-panel">
      <h1 id="formTitle">Surat Tugas</h1>
      <p class="form-hint">Isi data di bawah — surat di sebelah kanan akan diperbarui otomatis.</p>
      <form id="letterForm" autocomplete="off"></form>
    </section>

    <section class="preview-panel">
      <div class="preview-toolbar">
        <span class="preview-label">Pratinjau</span>
        <button type="button" id="printBtn" class="print-btn">Cetak / Simpan sebagai PDF</button>
      </div>
      <div class="paper-scroll">
        <article class="paper" id="paper"></article>
      </div>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
